name: Build Artifacts
on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        default: main
      image_tag:
        description: 'Image tag to push (defaults to ref if empty)'
        required: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref_name }}
      IMAGE_TAG: ${{ github.event.release.tag_name || github.event.inputs.image_tag || github.event.inputs.ref || github.ref_name }}

    steps:
      # Mandatory checkout action
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      # Docker Hub Log In
      - name: Login to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Free space before build
        run: |
          docker system prune -af || true
          docker builder prune -af || true

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        id: docker-buildx
        uses: docker/setup-buildx-action@v3

      # Run docker build immich-server
      - name: Build immich-server
        id: build_immich_server
        run: |
          if [ -f ./server/Dockerfile ]; then
            docker buildx build --platform=linux/arm64,linux/amd64 \
            -t enarciso/immich-server:latest \
            -t enarciso/immich-server:${IMAGE_TAG} \
            --push \
            -f ./server/Dockerfile .
          else
            echo "Dockerfile is not found"
            exit 1
          fi

      # Run docker build immich-server
      - name: Build immich-machine-learning
        id: build_immich_ml
        run: |
          if [ -f ./machine-learning/Dockerfile ]; then
            docker buildx build --platform=linux/arm64,linux/amd64 \
            -t enarciso/immich-machine-learning:latest \
            -t enarciso/immich-machine-learning:${IMAGE_TAG} \
            --push \
            -f ./machine-learning/Dockerfile ./machine-learning/
          else
            echo "Dockerfile is not found"
            exit 1
          fi

      - name: Cleanup after build
        if: always()
        run: |
          docker system prune -af || true
          docker builder prune -af || true
